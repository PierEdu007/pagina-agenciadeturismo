<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DFBF" />
      <stop offset="50%" stop-color="#D4A373" />
      <stop offset="100%" stop-color="#9C6B38" />
    </linearGradient>
    <linearGradient id="terraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F" />
      <stop offset="100%" stop-color="#C85A32" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Fondo circular oscuro andino con borde dorado -->
  <circle cx="32" cy="32" r="30" fill="#0F1412" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Geometría Sagrada Andina: Cruz del Sur / Chakana -->
  <g filter="url(#glow)">
    <!-- Silueta exterior escalonada de la Chakana -->
    <path d="
      M 26 12 L 38 12 L 38 18 L 46 18 L 46 26 L 52 26 L 52 38 L 46 38 L 46 46 L 38 46 L 38 52 L 26 52 L 26 46 L 18 46 L 18 38 L 12 38 L 12 26 L 18 26 L 18 18 L 26 18 Z
    " fill="url(#goldGrad)" />

    <!-- Núcleo interior terracota -->
    <path d="
      M 28 17 L 36 17 L 36 21 L 43 21 L 43 28 L 47 28 L 47 36 L 43 36 L 43 43 L 36 43 L 36 47 L 28 47 L 28 43 L 21 43 L 21 36 L 17 36 L 17 28 L 21 28 L 21 21 L 28 21 Z
    " fill="url(#terraGrad)" />

    <!-- Centro solar / Portal Hanpi (Sanación y Luz) -->
    <circle cx="32" cy="32" r="6" fill="#0F1412" stroke="url(#goldGrad)" stroke-width="1.8" />
    <circle cx="32" cy="32" r="2.5" fill="#FFFFFF" />

    <!-- Destellos de luz en las 4 direcciones sagradas (Suyos) -->
    <circle cx="32" cy="15" r="1.5" fill="#FAF8F4" />
    <circle cx="49" cy="32" r="1.5" fill="#FAF8F4" />
    <circle cx="32" cy="49" r="1.5" fill="#FAF8F4" />
    <circle cx="15" cy="32" r="1.5" fill="#FAF8F4" />
  </g>
</svg>
